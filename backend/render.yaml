services:
  - type: web
    name: dyslexai-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false          # set manually in Render dashboard — never committed
      - key: ALLOWED_ORIGINS
        sync: false          # optional — extra origins beyond the ones in main.py,
                             # comma separated. Production is already in code.
