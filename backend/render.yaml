services:
  - type: web
    name: dyslexai-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false          # set manually in Render dashboard — never committed
      - key: ALLOWED_ORIGINS
        sync: false          # set to your deployed frontend URL, e.g. https://dyslexai.vercel.app
